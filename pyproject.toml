[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ansys-agent"
version = "0.1.0"
description = "Ansys Maxwell 电机电磁仿真对话助手"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "tiktoken>=0.7.0",
    "prompt_toolkit>=3.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ansys = [
    "pyaedt>=0.9.0",
    "ansys-fluent-core>=0.20.0",
    "ansys-motorcad-core>=0.7.0",
    "ansys-mapdl-core>=0.68.0",
    "ansys-dyna-core>=0.8.0",
    "ansys-dpf-post>=0.7.0",
    "ansys-dynamicreporting-core>=0.8.0",
]
rag = [
    "pypdf>=4.2.0",
    "sentence-transformers>=2.7.0",
    "numpy>=1.26.0",
]
mcp = [
    "mcp>=1.0.0",
    "duckduckgo-mcp-server>=0.1.0",
]
all = [
    "ansys-agent[ansys,rag,mcp]",
    "python-docx>=1.1.0",
]

[project.scripts]
ansys-agent = "main:cli"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
