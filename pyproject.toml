[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ansys-agent"
version = "0.2.0"
description = "Ansys 电机电磁仿真对话助手 - 支持 Maxwell, Icepak, Motor-CAD, Fluent, MAPDL, LS-DYNA"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AnsysAgent Team"}
]
keywords = ["ansys", "maxwell", "motor", "electromagnetic", "simulation", "ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "tiktoken>=0.7.0",
    "prompt_toolkit>=3.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ansys = [
    "pyaedt>=0.9.0",
    "ansys-fluent-core>=0.20.0",
    "ansys-motorcad-core>=0.7.0",
    "ansys-mapdl-core>=0.68.0",
    "ansys-dyna-core>=0.8.0",
    "ansys-dpf-post>=0.7.0",
    "ansys-dynamicreporting-core>=0.8.0",
]
rag = [
    "pypdf>=4.2.0",
    "sentence-transformers>=2.7.0",
    "numpy>=1.26.0",
    "llama-index-core>=0.12,<1.0",
    "llama-index-vector-stores-chroma>=0.4,<1.0",
    "chromadb>=0.5,<2.0",
]
mcp = [
    "mcp>=1.0.0",
    "duckduckgo-mcp-server>=0.1.0",
]
doc = [
    "python-docx>=1.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]
all = [
    "ansys-agent[ansys,rag,mcp,doc,dev]",
]

[project.urls]
Homepage = "https://github.com/your-org/AnsysAgent"
Documentation = "https://github.com/your-org/AnsysAgent/blob/main/README.md"
Repository = "https://github.com/your-org/AnsysAgent"
Changelog = "https://github.com/your-org/AnsysAgent/blob/main/CHANGELOG.md"

[project.scripts]
ansys-agent = "main:cli"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
